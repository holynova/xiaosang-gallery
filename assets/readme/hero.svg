    <!-- col 3: crossover purple -->
    <g>
      <rect x="976" y="72" width="134" height="140" rx="10" fill="#6B4A8A"/>
      <path d="M 1043 96 L 1052 122 L 1079 122 L 1057 138 L 1065 164 L 1043 148 L 1021 164 L 1029 138 L 1007 122 L 1034 122 Z" fill="#F5C64B"/>
      <path d="M 1000 192 L 1043 160 L 1086 192" fill="none" stroke="#C9A0DC" stroke-width="5" stroke-linecap="round"/>
