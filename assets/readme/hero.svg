    <text x="898" y="340" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#6B5F54" text-anchor="middle">山河入版 · 纸上旅行 · 农民画与印章 · 玉雕扑克牌</text>
