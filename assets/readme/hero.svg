    </g>
    <!-- col 2: gouache water -->
    <g>
      <rect x="830" y="72" width="134" height="96" rx="10" fill="#7FA8C9"/>
      <path d="M 830 140 Q 863 124 897 140 Q 930 156 964 140 L 964 168 L 830 168 Z" fill="#4A7A9A"/>
      <circle cx="936" cy="98" r="12" fill="#FBF9F2"/>
